name: AUR Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (e.g. 0.2.0)'
        required: true
        type: string

jobs:
  deploy-realtek-realmanage:
    name: Publish realtek-realmanage to AUR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PKGBUILD version
        env:
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=$NEW_VERSION/" aur/realtek-realmanage/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" aur/realtek-realmanage/PKGBUILD

      - name: Publish realtek-realmanage to AUR
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: realtek-realmanage
          pkgbuild: aur/realtek-realmanage/PKGBUILD
          commit_username: 88plug
          commit_email: andrew@88plug.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.ver.outputs.version }}"
          force_push: true
